services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Sms_Service_Passw0rd}"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mock-provider:
    build: ./src/MockSmsProvider
    environment:
      FAIL_RATE: "${FAIL_RATE:-0.15}"
    ports:
      - "8081:8080"

  api:
    build: ./src/SmsService.Api
    environment:
      ConnectionStrings__Default: "Server=sqlserver;Database=SmsService;User Id=sa;Password=${SA_PASSWORD:-Sms_Service_Passw0rd};TrustServerCertificate=True"
      Provider__BaseUrl: "http://mock-provider:8080"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      # The aspnet image has no curl, so no healthcheck here; the API retries transient provider failures anyway.
      mock-provider:
        condition: service_started
